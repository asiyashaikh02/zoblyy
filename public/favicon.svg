<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#0A0F1D" />
  <defs>
    <linearGradient id="fav_blue_base" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2276FF" />
      <stop offset="40%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#0035D6" />
    </linearGradient>
    <linearGradient id="fav_specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#BCE3FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="fav_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
  </defs>

  <!-- 3D inflated Z stroke -->
  <path
    d="M 17 21 H 45 C 47.5 21 48 23 45.5 26 L 22.5 44 C 20.5 46 22 48 25 48 H 47 C 50 48 51.5 46.5 52 44"
    stroke="url(#fav_blue_base)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Glossy top specular reflection -->
  <ellipse cx="28" cy="18.5" rx="7" ry="2.2" fill="url(#fav_specular)" filter="url(#fav_blur)" />
  <circle cx="19" cy="20" r="1.5" fill="#FFFFFF" opacity="0.9" />
</svg>
